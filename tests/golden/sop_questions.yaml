# Golden questions for the SOP repos. expect_files are "repo:path" (path relative to that repo's root).
# A question passes when the share of expected files cited >= min_recall
# and the share of verified steps >= min_verified_ratio.
- question: How does scheduling work in Tasks?
  min_recall: 1.0
  min_verified_ratio: 0.75
  expect_files:
    - sop-web:src/sub-components/tasks/create-task/TaskCreation.tsx
    - sop-web:src/sub-components/tasks/create-task/task.graphql.ts
    - sop-backend:src/module/tasks/task/resolvers.ts
    - sop-backend:src/queue/task/main.ts
- question: How does a staff member complete a task?
  expect_files:
