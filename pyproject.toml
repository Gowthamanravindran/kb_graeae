[project]
name = "kb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gowthaman", email = "gowthaman.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "graphql-core>=3.3.1",
    "httpx>=0.28.1",
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "networkx>=3.7",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.3",
    "zstandard>=0.25.0",
]

[project.scripts]
kb = "kb.cli:main"
kb-registry = "kb_registry.cli:main"

[project.optional-dependencies]
registry = [
    "alembic>=1.20.1",
    "boto3>=1.43.120",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "boto3>=1.43.120",
    "fastapi>=0.162.0",
    "moto[s3]>=5.2.5",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.2.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]
[tool.pytest.ini_options]
pythonpath = ["tests", "tests/registry", "tests/sync"]

[tool.uv.build-backend]
module-name = ["kb", "kb_registry"]
